name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # No dependencies: the suite loads BoardStore.js directly.
      - name: Unit tests
        run: npm test

      - name: Mutation testing
        run: npm run mutate

      # Catches a manifest that would be rejected at install time.
      - name: Manifest shape
        run: |
          node -e '
            const m = require("./manifest.json");
            const req = ["schemaVersion","id","name","version","author","description","kinds","entryPoints"];
            const missing = req.filter(k => !(k in m));
            if (missing.length) { console.error("missing manifest fields:", missing); process.exit(1) }
            for (const [kind, file] of Object.entries(m.entryPoints)) {
              if (!require("fs").existsSync(file)) { console.error("missing entry point:", file); process.exit(1) }
            }
            console.log("manifest ok:", m.id);
          '

  qt-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Qt Quick test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtquick qml6-module-qtquick-window qml6-module-qttest qml6-module-qtqml-workerscript
      # A member shadowing a final one stops the shell loading the whole file,
      # and only this check sees it before a live desktop does.
      - name: Final-property check
        run: |
          overrides=$(/usr/lib/qt6/bin/qmllint ./*.qml 2>&1 | grep -F 'property-override' || true)
          if [ -n "$overrides" ]; then echo "$overrides"; exit 1; fi

      - name: Pointer, theme, and small-window tests
        run: npm run test:ui
